services:
  preflight:
    environment:
      HEFESTO_BOOTSTRAP: "true"
  app:
    restart: "no"
    ports: ["127.0.0.1:8099:2368"]
    depends_on:
      mailpit:
        condition: service_started
    environment:
      HEFESTO_BOOTSTRAP: "true"
      url: http://localhost:8099
      mail__from: noreply@example.test
      mail__options__host: mailpit
      mail__options__port: "1025"
      mail__options__secure: "false"
      mail__options__auth__user: ""
      mail__options__auth__pass: ""
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: "no"
    ports: ["127.0.0.1:8027:8025"]
    networks: [frontend]
